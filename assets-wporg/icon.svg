<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Cadastro Certo: ficha com caracteres do CNPJ em células (letras em âmbar) e selo de conferido. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#114954"/>
      <stop offset="1" stop-color="#0b3139"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="url(#fundo)"/>
  <!-- ficha -->
  <rect x="34" y="40" width="168" height="176" rx="16" fill="#f6f4ee"/>
  <rect x="54" y="62" width="74" height="12" rx="6" fill="#9fb2b5"/>
  <!-- linha de células: 1 2 A B -->
  <g font-family="DejaVu Sans Mono" font-weight="bold" font-size="40" text-anchor="middle">
    <rect x="50" y="92" width="34" height="50" rx="7" fill="#ffffff" stroke="#c9d3d4" stroke-width="3"/>
    <text x="67" y="131" fill="#123c44">1</text>
    <rect x="88" y="92" width="34" height="50" rx="7" fill="#ffffff" stroke="#c9d3d4" stroke-width="3"/>
    <text x="105" y="131" fill="#123c44">2</text>
    <rect x="126" y="92" width="34" height="50" rx="7" fill="#ffc94d"/>
    <text x="143" y="131" fill="#5a3b00">A</text>
    <rect x="164" y="92" width="34" height="50" rx="7" fill="#ffc94d"/>
    <text x="181" y="131" fill="#5a3b00">B</text>
  </g>
  <rect x="54" y="160" width="100" height="10" rx="5" fill="#c9d3d4"/>
  <rect x="54" y="182" width="64" height="10" rx="5" fill="#c9d3d4"/>
  <!-- selo de conferido -->
  <circle cx="190" cy="190" r="42" fill="#0b3139"/>
  <circle cx="190" cy="190" r="34" fill="#22b573"/>
  <path d="M173 191 l12 12 l23 -25" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
