<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <!-- Cadastro Certo: faixa do diretório. CNPJ alfanumérico oficial com letras em âmbar e dígito verificador conferido. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#124d58"/>
      <stop offset="1" stop-color="#0a2c33"/>
    </linearGradient>
    <pattern id="grade" width="44" height="56" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="36" height="44" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1544" height="500" fill="url(#fundo)"/>
  <rect width="1544" height="500" fill="url(#grade)"/>

  <!-- texto -->
  <g font-family="Fira Sans">
    <text x="96" y="196" font-size="88" font-weight="700" fill="#ffffff">Cadastro Certo</text>
    <text x="100" y="262" font-size="38" font-weight="500" fill="#ffc94d">CPF e CNPJ alfanumérico</text>
    <text x="100" y="312" font-size="30" font-weight="400" fill="#cfe0e2">Checkout clássico e em blocos · WooCommerce</text>
    <text x="100" y="356" font-size="30" font-weight="400" fill="#cfe0e2">Mesmos dados do Brazilian Market</text>
  </g>

  <!-- ficha com o CNPJ -->
  <g transform="translate(834 92)">
    <rect x="12" y="14" width="600" height="316" rx="26" fill="#000000" fill-opacity="0.25"/>
    <rect x="0" y="0" width="600" height="316" rx="26" fill="#f6f4ee"/>
    <text x="40" y="64" font-family="Fira Sans" font-size="26" font-weight="600" fill="#5d7579" letter-spacing="2">CNPJ</text>
    <g font-family="DejaVu Sans Mono" font-weight="bold" font-size="40" text-anchor="middle">
      <!-- 12.ABC.345/01DE-35: cada caractere numa célula; pontuação entre elas -->
      <g fill="#123c44">
        <rect x="36" y="96" width="30" height="52" rx="6" fill="#ffffff" stroke="#c9d3d4" stroke-width="2"/><text x="51" y="136">1</text>
        <rect x="68" y="96" width="30" height="52" rx="6" fill="#ffffff" stroke="#c9d3d4" stroke-width="2"/><text x="83" y="136">2</text>
        <text x="106" y="136" fill="#8aa0a3">.</text>
        <rect x="114" y="96" width="30" height="52" rx="6" fill="#ffc94d"/><text x="129" y="136" fill="#5a3b00">A</text>
        <rect x="146" y="96" width="30" height="52" rx="6" fill="#ffc94d"/><text x="161" y="136" fill="#5a3b00">B</text>
        <rect x="178" y="96" width="30" height="52" rx="6" fill="#ffc94d"/><text x="193" y="136" fill="#5a3b00">C</text>
        <text x="216" y="136" fill="#8aa0a3">.</text>
        <rect x="224" y="96" width="30" height="52" rx="6" fill="#ffffff" stroke="#c9d3d4" stroke-width="2"/><text x="239" y="136">3</text>
        <rect x="256" y="96" width="30" height="52" rx="6" fill="#ffffff" stroke="#c9d3d4" stroke-width="2"/><text x="271" y="136">4</text>
        <rect x="288" y="96" width="30" height="52" rx="6" fill="#ffffff" stroke="#c9d3d4" stroke-width="2"/><text x="303" y="136">5</text>
        <text x="327" y="136" fill="#8aa0a3">/</text>
        <rect x="338" y="96" width="30" height="52" rx="6" fill="#ffffff" stroke="#c9d3d4" stroke-width="2"/><text x="353" y="136">0</text>
        <rect x="370" y="96" width="30" height="52" rx="6" fill="#ffffff" stroke="#c9d3d4" stroke-width="2"/><text x="385" y="136">1</text>
        <rect x="402" y="96" width="30" height="52" rx="6" fill="#ffc94d"/><text x="417" y="136" fill="#5a3b00">D</text>
        <rect x="434" y="96" width="30" height="52" rx="6" fill="#ffc94d"/><text x="449" y="136" fill="#5a3b00">E</text>
        <text x="474" y="136" fill="#8aa0a3">-</text>
        <rect x="486" y="96" width="30" height="52" rx="6" fill="#22b573"/><text x="501" y="136" fill="#ffffff">3</text>
        <rect x="518" y="96" width="30" height="52" rx="6" fill="#22b573"/><text x="533" y="136" fill="#ffffff">5</text>
      </g>
    </g>
    <!-- marcação do dígito verificador -->
    <path d="M488 166 h58" stroke="#22b573" stroke-width="4" stroke-linecap="round"/>
    <text x="548" y="200" font-family="Fira Sans" font-size="22" font-weight="600" fill="#1c8a59" text-anchor="end">dígito verificador</text>
    <!-- linhas de cadastro -->
    <rect x="40" y="230" width="220" height="14" rx="7" fill="#c9d3d4"/>
    <rect x="40" y="262" width="150" height="14" rx="7" fill="#c9d3d4"/>
    <!-- selo -->
    <circle cx="520" cy="262" r="50" fill="#0b3139"/>
    <circle cx="520" cy="262" r="41" fill="#22b573"/>
    <path d="M499 263 l15 15 l28 -31" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
